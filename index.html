<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🌸 宝宝认字乐园</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
body{display:flex;flex-direction:column;background:#fef6f0;transition:background .4s}
body.bg-game{background:#f2faf0}
body.bg-stats{background:#f0f0fa}

.top-bar{display:flex;align-items:center;padding:8px 16px;gap:6px;font-size:.82rem;color:#b08860;background:rgba(255,255,255,.6);flex-shrink:0}
.top-bar .sn{font-weight:bold;font-size:1rem;color:#e8a020}
.top-bar .bd{margin-left:4px;font-size:.9rem}
.top-bar .gn{margin-left:auto;font-size:.78rem;color:#bba48a;cursor:pointer}
.pline{height:3px;background:#f0e4d4;flex-shrink:0}
.pline-fill{height:100%;background:linear-gradient(90deg,#ffb74d,#ff9800);transition:width .4s;border-radius:0 2px 2px 0}

.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 16px 6px;overflow-y:auto;overflow-x:hidden;position:relative}

/* 分组选择 */
.grp-sel{display:none;flex-direction:column;align-items:center;width:100%;max-width:420px}
.grp-sel.on{display:flex}
.grp-title{font-size:1.25rem;font-weight:900;color:#4a2c0a;margin-bottom:10px}
.grp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.gc{display:flex;flex-direction:column;align-items:center;padding:14px 8px;border-radius:18px;background:#fff;border:2.5px solid #f0e4d4;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.04);position:relative}
.gc:active{transform:scale(.96)}
.gc.done{border-color:#a5d6a7;background:#f1f8f1}
.gc .ge{font-size:1.5rem;margin-bottom:3px}
.gc .gn2{font-size:.92rem;font-weight:bold;color:#5c3a1e}
.gc .gp{font-size:.7rem;color:#b08860;margin-top:2px}
.gc .gck{position:absolute;top:6px;right:8px;font-size:.9rem}

/* 学习 */
.lv{display:none;flex-direction:column;align-items:center;width:100%;max-width:400px}
.lv.on{display:flex}
.ce{font-size:6.5rem;line-height:1.15;filter:drop-shadow(3px 5px 8px rgba(0,0,0,.06));cursor:pointer}
.ce:active{transform:scale(1.12) rotate(5deg)}
.ce.bou{animation:eb .45s ease}
@keyframes eb{0%{transform:scale(.85) rotate(-3deg)}50%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1)}}
.ch{font-size:5rem;font-weight:900;color:#4a2c0a;margin:8px 0 6px;text-shadow:0 3px 0 #e8cfb0}
.sbtn{display:inline-flex;align-items:center;gap:6px;padding:11px 30px;font-size:1.2rem;font-weight:bold;border:none;border-radius:50px;background:linear-gradient(135deg,#ffb74d,#ffa726);color:#5c2e0e;cursor:pointer;box-shadow:0 4px 0 #e08a1e;font-family:inherit}
.sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #e08a1e}
.nr{display:flex;gap:10px;margin-top:12px;width:100%;max-width:320px}
.nb{flex:1;padding:9px 0;font-size:1rem;font-weight:bold;border:none;border-radius:16px;background:#fff;color:#a06830;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06);font-family:inherit}
.nb:active{transform:scale(.96)}
.bgb{margin-top:10px;padding:6px 20px;font-size:.85rem;border:none;border-radius:14px;background:#f5ece3;color:#a07040;cursor:pointer;font-family:inherit;font-weight:bold}
.lc{font-size:.78rem;color:#bba48a;margin-top:6px}

/* 游戏 */
.gv{display:none;flex-direction:column;align-items:center;width:100%;max-width:400px}
.gv.on{display:flex}
.gh{font-size:1rem;color:#6a994e;font-weight:bold;margin-bottom:4px}
.geb{font-size:6.5rem;line-height:1.15;filter:drop-shadow(3px 5px 8px rgba(0,0,0,.06));animation:gb 2.5s ease-in-out infinite;cursor:pointer}
@keyframes gb{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.geht{font-size:.75rem;color:#aaa;margin-top:2px}
.chs{display:flex;gap:12px;margin-top:16px}
.cb{font-size:3rem;font-weight:900;width:84px;height:84px;display:flex;align-items:center;justify-content:center;border-radius:22px;border:3px solid #d4edda;background:#fff;color:#2d5016;cursor:pointer;box-shadow:0 4px 0 #a5d6a7;font-family:inherit}
.cb:active{transform:translateY(3px);box-shadow:0 1px 0 #a5d6a7}
.cb.ok{background:#66bb6a;color:#fff;border-color:#43a047;animation:cp .5s ease;box-shadow:0 4px 0 #2e7d32}
@keyframes cp{0%{transform:scale(1)}35%{transform:scale(1.2) rotate(-3deg)}65%{transform:scale(.95) rotate(2deg)}100%{transform:scale(1.05)}}
.cb.no{animation:ws .4s ease;border-color:#ffe0b2;background:#fffde7}
@keyframes ws{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* 成就 */
.sv{display:none;flex-direction:column;align-items:center;width:100%;max-width:420px;overflow-y:auto;padding-bottom:10px}
.sv.on{display:flex}
.sh{font-size:1.25rem;font-weight:900;color:#4a2c0a;margin-bottom:12px}
.sc3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;margin-bottom:14px}
.sc{display:flex;flex-direction:column;align-items:center;padding:14px 6px;border-radius:16px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.sc .sn2{font-size:1.8rem;font-weight:900;color:#e8a020}
.sc .sl{font-size:.72rem;color:#a08060;margin-top:2px}
.bw{width:100%;text-align:center;padding:12px;background:#fff;border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,.04);margin-bottom:12px}
.bwt{font-size:.85rem;font-weight:bold;color:#8d6e63;margin-bottom:6px}
.bwi{font-size:1.8rem;letter-spacing:4px;min-height:36px}
.bwe{font-size:.8rem;color:#ccc}
.ms{width:100%;background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.mst{font-size:.85rem;font-weight:bold;color:#8d6e63;margin-bottom:8px}
.mg{display:flex;flex-wrap:wrap;gap:6px}
.mc{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:#e8f5e9;font-size:1.1rem;font-weight:900;color:#2e7d32}
.mc.ny{background:#f5f5f5;color:#ddd}
.rbtn{margin-top:14px;padding:8px 24px;font-size:.82rem;border:1.5px solid #ffcdd2;border-radius:14px;background:#fff;color:#e57373;cursor:pointer;font-family:inherit;font-weight:bold}

/* 答对浮层 */
.sov{position:absolute;inset:0;background:rgba(255,255,255,.94);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20}
.sov.show{display:flex;animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.se{font-size:4rem;animation:sb .6s ease infinite alternate}
@keyframes sb{from{transform:translateY(0) scale(1)}to{transform:translateY(-10px) scale(1.08)}}
.ss{font-size:2.2rem;margin:4px 0;animation:ssp .8s ease}
@keyframes ssp{from{transform:rotate(0) scale(0)}60%{transform:rotate(220deg) scale(1.2)}to{transform:rotate(360deg) scale(1)}}
.st2{font-size:1.5rem;font-weight:bold;color:#e65100;margin:4px 0}
.ssb{font-size:.95rem;color:#8d6e63;margin-bottom:8px}
.snx{padding:11px 36px;font-size:1.1rem;font-weight:bold;border:none;border-radius:50px;background:linear-gradient(135deg,#ff9800,#ff6d00);color:#fff;cursor:pointer;box-shadow:0 4px 0 #bf360c;font-family:inherit}
.snx:active{transform:translateY(3px);box-shadow:0 1px 0 #bf360c}

.chb{flex-shrink:0;text-align:center;padding:5px 14px;font-size:.9rem;font-weight:bold;color:#d4790a;background:rgba(255,243,220,.85);min-height:32px;display:flex;align-items:center;justify-content:center}
.cf{position:fixed;top:50px;right:12px;background:linear-gradient(135deg,#ff6f00,#ff8f00);color:#fff;padding:5px 14px;border-radius:50px;font-size:.85rem;font-weight:bold;display:none;z-index:30}
.cf.show{display:block;animation:ci .3s ease}
@keyframes ci{from{transform:scale(0) rotate(-10deg)}to{transform:scale(1)}}

.tb{flex-shrink:0;display:flex;background:#fff;border-top:1px solid #f0e8e0;padding-bottom:env(safe-area-inset-bottom,0)}
.ti{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 0 5px;font-size:.68rem;font-weight:bold;color:#bba48a;cursor:pointer;border:none;background:transparent;font-family:inherit;position:relative}
.ti .ico{font-size:1.4rem;margin-bottom:1px}
.ti.on{color:#e8875b}
.ti.on::after{content:'';position:absolute;top:0;left:25%;right:25%;height:2.5px;background:#e8875b;border-radius:0 0 2px 2px}
.ti.on.tg{color:#4caf50}.ti.on.tg::after{background:#4caf50}
.ti.on.ts{color:#7e57c2}.ti.on.ts::after{background:#7e57c2}

.fli{position:fixed;pointer-events:none;font-size:2rem;z-index:100;animation:fu 1.1s ease-out forwards}
@keyframes fu{0%{opacity:1;transform:translateY(0) scale(.5)}50%{opacity:1;transform:translateY(-50px) scale(1.15)}100%{opacity:0;transform:translateY(-120px) scale(.7)}}
.fw{position:fixed;pointer-events:none;width:7px;height:7px;border-radius:50%;z-index:99;animation:fb .7s ease-out forwards}
@keyframes fb{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}
</style>
</head>
<body>
<div class="cf" id="comboBadge"></div>
<div class="top-bar">
  <span>⭐</span><span class="sn" id="starCount">0</span>
  <span class="bd" id="badgeArea"></span>
  <span class="gn" id="topGroupName" onclick="showGroups()">📂 选分组</span>
</div>
<div class="pline"><div class="pline-fill" id="pFill" style="width:0%"></div></div>
<div class="main">
  <div class="grp-sel on" id="grpSel">
    <div class="grp-title">🌈 选一组来学吧！</div>
    <div class="grp-grid" id="grpGrid"></div>
  </div>
  <div class="lv" id="lv">
    <div class="ce" id="lEmoji">🌸</div>
    <div class="ch" id="lHanzi">花</div>
    <button class="sbtn" id="spkBtn">🔊 读一读</button>
    <div class="nr">
      <button class="nb" id="prevB">⬅ 上一个</button>
      <button class="nb" id="nextB">下一个 ➡</button>
    </div>
    <div class="lc" id="lCnt">1 / 10</div>
    <button class="bgb" onclick="showGroups()">📂 换一组</button>
  </div>
  <div class="gv" id="gv">
    <div class="gh" id="gHint">👆 这是哪个字？</div>
    <div class="geb" id="gEmoji" onclick="speakGameWord()">🌸</div>
    <div class="geht">👆 点图片听读音</div>
    <div class="chs" id="chArea"></div>
    <button class="bgb" style="background:#e8f5e9;color:#388e3c;margin-top:12px" onclick="showGroups()">📂 换一组</button>
  </div>
  <div class="sv" id="sv">
    <div class="sh">🏆 学习成就</div>
    <div class="sc3">
      <div class="sc"><div class="sn2" id="stStar">0</div><div class="sl">⭐ 星星</div></div>
      <div class="sc"><div class="sn2" id="stBadge">0</div><div class="sl">🏅 勋章</div></div>
      <div class="sc"><div class="sn2" id="stMaster">0</div><div class="sl">✅ 已认字</div></div>
    </div>
    <div class="bw"><div class="bwt">🎖 勋章墙</div><div class="bwi" id="bwItems"></div></div>
    <div class="ms"><div class="mst">📖 认字进度</div><div class="mg" id="mGrid"></div></div>
    <button class="rbtn" onclick="resetData()">🗑 重置所有进度</button>
  </div>
  <div class="sov" id="sucOv">
    <div class="se" id="sucE">🎉</div>
    <div class="ss">⭐</div>
    <div class="st2" id="sucT">太棒了！</div>
    <div class="ssb" id="sucS">你认出了「花」</div>
    <button class="snx" id="sucNx">👉 下一题</button>
  </div>
</div>
<div class="chb" id="chBar">🌸 选一组开始学习吧 🎀</div>
<div class="tb">
  <button class="ti on" id="t1" onclick="switchTab('learn')"><span class="ico">📖</span>学一学</button>
  <button class="ti tg" id="t2" onclick="switchTab('game')"><span class="ico">🎮</span>玩一玩</button>
  <button class="ti ts" id="t3" onclick="switchTab('stats')"><span class="ico">🏆</span>成就</button>
</div>
<script>
// ===== 字库分组 =====
const GROUPS = [
  {name:"家人",icon:"👨‍👩‍👧",words:[
    {h:"妈",e:"👩"},{h:"爸",e:"👨"},{h:"哥",e:"🧒"},{h:"姐",e:"👧"},
    {h:"奶",e:"👵"},{h:"爷",e:"👴"},{h:"宝",e:"👶"},{h:"贝",e:"🐚"}]},
  {name:"动物",icon:"🐾",words:[
    {h:"猫",e:"🐱"},{h:"狗",e:"🐶"},{h:"鸟",e:"🐦"},{h:"鱼",e:"🐟"},
    {h:"兔",e:"🐰"},{h:"马",e:"🐴"},{h:"牛",e:"🐮"},{h:"羊",e:"🐑"},
    {h:"鸡",e:"🐔"},{h:"鸭",e:"🦆"}]},
  {name:"动物2",icon:"🦁",words:[
    {h:"猪",e:"🐷"},{h:"熊",e:"🐻"},{h:"虎",e:"🐯"},{h:"狮",e:"🦁"},
    {h:"猴",e:"🐒"},{h:"虫",e:"🐛"},{h:"龙",e:"🐲"},{h:"蛇",e:"🐍"}]},
  {name:"自然",icon:"🌈",words:[
    {h:"天",e:"☀️"},{h:"地",e:"🌍"},{h:"日",e:"🌞"},{h:"月",e:"🌙"},
    {h:"云",e:"☁️"},{h:"雨",e:"☔"},{h:"风",e:"💨"},{h:"雪",e:"❄️"},
    {h:"星",e:"⭐"},{h:"火",e:"🔥"}]},
  {name:"植物",icon:"🌳",words:[
    {h:"花",e:"🌸"},{h:"草",e:"🌿"},{h:"树",e:"🌳"},{h:"叶",e:"🍃"},
    {h:"果",e:"🍎"},{h:"瓜",e:"🍉"},{h:"竹",e:"🎋"},{h:"米",e:"🌾"}]},
  {name:"食物",icon:"🍚",words:[
    {h:"饭",e:"🍚"},{h:"菜",e:"🥬"},{h:"肉",e:"🍗"},{h:"水",e:"💧"},
    {h:"糖",e:"🍭"},{h:"糕",e:"🍰"},{h:"奶",e:"🥛"},{h:"面",e:"🍜"}]},
  {name:"颜色",icon:"🎨",words:[
    {h:"红",e:"🔴"},{h:"黄",e:"🟡"},{h:"蓝",e:"🔵"},{h:"绿",e:"🟢"},
    {h:"粉",e:"💗"},{h:"紫",e:"🟣"},{h:"黑",e:"⚫"},{h:"白",e:"⚪"}]},
  {name:"数字",icon:"🔢",words:[
    {h:"一",e:"1️⃣"},{h:"二",e:"2️⃣"},{h:"三",e:"3️⃣"},{h:"四",e:"4️⃣"},
    {h:"五",e:"5️⃣"},{h:"六",e:"6️⃣"},{h:"七",e:"7️⃣"},{h:"八",e:"8️⃣"},
    {h:"九",e:"9️⃣"},{h:"十",e:"🔟"}]},
  {name:"身体",icon:"🖐️",words:[
    {h:"手",e:"🖐️"},{h:"口",e:"👄"},{h:"目",e:"👁️"},{h:"耳",e:"👂"},
    {h:"足",e:"🦶"},{h:"心",e:"❤️"},{h:"头",e:"🗣️"},{h:"牙",e:"🦷"}]},
  {name:"动作",icon:"🏃",words:[
    {h:"走",e:"🚶"},{h:"跑",e:"🏃"},{h:"跳",e:"🦘"},{h:"吃",e:"🍽️"},
    {h:"喝",e:"🥤"},{h:"睡",e:"😴"},{h:"笑",e:"😊"},{h:"哭",e:"😢"},
    {h:"唱",e:"🎤"},{h:"舞",e:"💃"}]},
  {name:"物品",icon:"🚗",words:[
    {h:"车",e:"🚗"},{h:"书",e:"📚"},{h:"笔",e:"✏️"},{h:"球",e:"⚽"},
    {h:"画",e:"🎨"},{h:"裙",e:"👗"},{h:"娃",e:"🎎"},{h:"灯",e:"💡"}]},
  {name:"大小多少",icon:"🐘",words:[
    {h:"大",e:"🐘"},{h:"小",e:"🐭"},{h:"多",e:"🍬"},{h:"少",e:"🥄"},
    {h:"上",e:"☝️"},{h:"下",e:"👇"},{h:"高",e:"🦒"},{h:"矮",e:"🐧"},
    {h:"快",e:"🐆"},{h:"慢",e:"🐢"}]}
];
const allWords = GROUPS.flatMap(g => g.words);

// ===== 持久化 =====
const SK = 'babyLearnV2';
function loadData(){
  try{const d=JSON.parse(localStorage.getItem(SK));if(d)return d;}catch(e){}
  return {stars:0,badges:[],mastered:{},groupIdx:{},learnPos:{}};
}
function saveData(){localStorage.setItem(SK,JSON.stringify(D));}
let D = loadData();

// ===== 状态 =====
let curTab='learn', curGrp=-1, lIdx=0, gIdx=0, combo=0, gAnswered=false;
let gQueue=[];

// ===== DOM =====
const $=id=>document.getElementById(id);
const grpSel=$('grpSel'),lv=$('lv'),gv=$('gv'),sv=$('sv');
const lEmoji=$('lEmoji'),lHanzi=$('lHanzi'),lCnt=$('lCnt');
const gEmoji=$('gEmoji'),gHint=$('gHint'),chArea=$('chArea');
const sucOv=$('sucOv'),sucE=$('sucE'),sucT=$('sucT'),sucS=$('sucS'),sucNx=$('sucNx');
const pFill=$('pFill'),chBar=$('chBar'),starEl=$('starCount'),badgeEl=$('badgeArea');
const comboBadge=$('comboBadge'),topGN=$('topGroupName');

// ===== 语音引擎（三级：SpeechSynthesis → 在线TTS → Web Audio） =====
const AC=window.AudioContext||window.webkitAudioContext;let actx;
function ensA(){if(!actx&&AC)actx=new AC();if(actx&&actx.state==='suspended')actx.resume();}
function playTone(f,d,t,v){ensA();if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}
function playChime(){ensA();playTone(880,.15,'sine',.08);setTimeout(()=>playTone(1100,.2,'sine',.06),100);}

let ttsVoice=null,ttsOK=false,ttsCked=false,ttsUnlk=false;
function initTTS(){
  if(!window.speechSynthesis)return;
  const lv=()=>{const vs=speechSynthesis.getVoices();if(!vs.length)return;
    for(const n of['Xiaoxiao','Xiaoyi','Meijia','Ting-Ting','Huihui','Female']){const f=vs.find(v=>v.lang.startsWith('zh')&&v.name.includes(n));if(f){ttsVoice=f;break;}}
    if(!ttsVoice)ttsVoice=vs.find(v=>v.lang==='zh-CN')||vs.find(v=>v.lang.startsWith('zh'))||null;
    if(ttsVoice)ttsOK=true;};
  lv();if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=lv;
  setTimeout(lv,500);setTimeout(lv,1500);
}
initTTS();
function ckTTS(){if(ttsCked)return ttsOK;if(!window.speechSynthesis){ttsCked=true;return false;}
  try{const v=speechSynthesis.getVoices();if(v.length>0){ttsOK=true;if(!ttsVoice)ttsVoice=v.find(x=>x.lang==='zh-CN')||v.find(x=>x.lang.startsWith('zh'))||null;}}catch(e){}
  ttsCked=true;return ttsOK;}
function unlkTTS(){if(ttsUnlk||!window.speechSynthesis)return;ttsUnlk=true;
  const u=new SpeechSynthesisUtterance('');u.volume=0;u.lang='zh-CN';try{speechSynthesis.speak(u);}catch(e){}}

const ttsApi='https://textreadtts.com/tts/convert?accessKey=FREE&language=chinese&speaker=speaker1&text=';
const aCache={};
function preloadTTS(t){if(aCache[t])return Promise.resolve();
  return fetch(ttsApi+encodeURIComponent(t)).then(r=>r.json()).then(d=>{if(d.code===0&&d.audio)aCache[t]=d.audio;}).catch(()=>{});}
function playOnlineTTS(t){
  if(aCache[t]){try{const a=new Audio(aCache[t]);a.onerror=()=>playChime();a.play().catch(()=>playChime());}catch(e){playChime();}return;}
  fetch(ttsApi+encodeURIComponent(t)).then(r=>r.json()).then(d=>{
    if(d.code===0&&d.audio){aCache[t]=d.audio;const a=new Audio(d.audio);a.onerror=()=>playChime();a.play().catch(()=>playChime());}
    else playChime();}).catch(()=>playChime());
}
let _fi=false;
function onFI(){if(_fi)return;_fi=true;ensA();unlkTTS();try{const a=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');a.play().then(()=>a.pause()).catch(()=>{});}catch(e){}}
['touchstart','click'].forEach(e=>document.addEventListener(e,onFI,{once:true,passive:true}));

function speakWord(t){
  ckTTS();
  if(ttsOK&&window.speechSynthesis){
    if(!ttsUnlk)unlkTTS();speechSynthesis.cancel();
    setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);if(ttsVoice)u.voice=ttsVoice;u.lang='zh-CN';u.rate=.78;u.pitch=1.3;u.volume=1;speechSynthesis.speak(u);
      const ri=setInterval(()=>{if(speechSynthesis.paused)speechSynthesis.resume();},200);u.onend=()=>clearInterval(ri);u.onerror=()=>clearInterval(ri);setTimeout(()=>clearInterval(ri),5000);},50);
  } else { playOnlineTTS(t); }
}

// ===== 鼓励语 =====
const chOK=["哇！太厉害了！🌟","宝宝真棒！👏","答对啦！小天才！🧠","太聪明了！🎉","好厉害呀！💪","一下就认出来了！🤩","真了不起！🥰","太太太棒啦！🌈","认字小达人！🏆","你做到了！🥳","好厉害呀宝宝！❤️","完美！💯"];
const chNO=["没关系，再试试！💪","差一点点，加油！🤗","再看看？你可以的！🌸","想一想，慢慢来～😊","不着急，再试一次！💕"];
const chCB=["连续答对！太强了！🔥","连对了好多！超厉害！⚡","连击！你最棒！🚀","停不下来！大王！👑"];
function rp(a){return a[Math.floor(Math.random()*a.length)];}

// ===== 分组选择 =====
function renderGroups(){
  const g=$('grpGrid');g.innerHTML='';
  GROUPS.forEach((gr,i)=>{
    const mastered=gr.words.filter(w=>D.mastered[w.h]).length;
    const done=mastered===gr.words.length;
    const d=document.createElement('div');d.className='gc'+(done?' done':'');
    d.innerHTML='<div class="ge">'+gr.icon+'</div><div class="gn2">'+gr.name+'</div><div class="gp">'+mastered+'/'+gr.words.length+' 已认识</div>'+(done?'<div class="gck">✅</div>':'');
    d.onclick=()=>selectGroup(i);
    g.appendChild(d);
  });
}
function selectGroup(i){
  curGrp=i;
  if(D.learnPos[i]!==undefined)lIdx=D.learnPos[i];else lIdx=0;
  topGN.textContent=GROUPS[i].icon+' '+GROUPS[i].name;
  if(curTab==='learn'){showLearn();}
  else if(curTab==='game'){showGame();}
  // 预加载该组音频
  setTimeout(()=>{if(!ttsOK){GROUPS[i].words.forEach(w=>preloadTTS(w.h));}},500);
}
function showGroups(){
  grpSel.classList.add('on');lv.classList.remove('on');gv.classList.remove('on');sv.classList.remove('on');
  renderGroups();chBar.textContent='🌈 选一组开始学习吧 🎀';pFill.style.width='0%';
}

// ===== Tab切换 =====
function switchTab(tab){
  curTab=tab;
  $('t1').className='ti'+(tab==='learn'?' on':'');
  $('t2').className='ti tg'+(tab==='game'?' on':'');
  $('t3').className='ti ts'+(tab==='stats'?' on':'');
  document.body.className=tab==='game'?'bg-game':tab==='stats'?'bg-stats':'';
  if(tab==='stats'){grpSel.classList.remove('on');lv.classList.remove('on');gv.classList.remove('on');sv.classList.add('on');renderStats();return;}
  sv.classList.remove('on');
  if(curGrp<0){showGroups();return;}
  if(tab==='learn')showLearn();else showGame();
}

// ===== 学习模式 =====
function showLearn(){
  grpSel.classList.remove('on');gv.classList.remove('on');sv.classList.remove('on');lv.classList.add('on');
  updateLearn();
}
function updateLearn(){
  const ws=GROUPS[curGrp].words;
  if(lIdx>=ws.length)lIdx=0;if(lIdx<0)lIdx=ws.length-1;
  const w=ws[lIdx];
  lEmoji.textContent=w.e;lHanzi.textContent=w.h;
  lEmoji.classList.remove('bou');void lEmoji.offsetWidth;lEmoji.classList.add('bou');
  lCnt.textContent=(lIdx+1)+' / '+ws.length;
  const pct=((lIdx+1)/ws.length*100);pFill.style.width=pct+'%';
  chBar.textContent='🌸 '+w.h+'！认一认这个字 🎀';
  D.learnPos[curGrp]=lIdx;saveData();
}
$('spkBtn').onclick=()=>{const w=GROUPS[curGrp].words[lIdx];speakWord(w.h);chBar.textContent='🔊 '+w.h+'！宝宝跟我读～';spawnF(2);};
$('prevB').onclick=()=>{lIdx--;updateLearn();};
$('nextB').onclick=()=>{lIdx++;updateLearn();};

// ===== 游戏模式 =====
function showGame(){
  grpSel.classList.remove('on');lv.classList.remove('on');sv.classList.remove('on');gv.classList.add('on');
  shuffleQ();loadQ();
}
function shuffleQ(){const ws=GROUPS[curGrp].words;gQueue=ws.map((_,i)=>i);for(let i=gQueue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[gQueue[i],gQueue[j]]=[gQueue[j],gQueue[i]];}gIdx=0;}
function loadQ(){
  if(gIdx>=gQueue.length)shuffleQ();
  gAnswered=false;
  const ws=GROUPS[curGrp].words,target=ws[gQueue[gIdx]];
  gEmoji.textContent=target.e;gHint.textContent='👆 这是哪个字？';
  gv._ct=target;
  // 干扰项：优先从本组取，不够从全局取
  const allH=[...new Set(ws.map(w=>w.h))];
  const dist=[];
  while(dist.length<2){
    const pool=allH.length>3?allH:[...new Set(allWords.map(w=>w.h))];
    const r=pool[Math.floor(Math.random()*pool.length)];
    if(r!==target.h&&!dist.includes(r))dist.push(r);
  }
  const opts=[target.h,...dist];
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  chArea.innerHTML='';
  opts.forEach(hz=>{const b=document.createElement('button');b.className='cb';b.textContent=hz;b.onclick=()=>onCh(b,hz,target);chArea.appendChild(b);});
  pFill.style.width=((gIdx+1)/gQueue.length*100)+'%';
  chBar.textContent='👆 看看图，选对的字！';
}
function speakGameWord(){if(gv._ct)speakWord(gv._ct.h);}
function onCh(btn,chosen,target){
  if(gAnswered)return;
  if(chosen===target.h){
    gAnswered=true;btn.classList.add('ok');combo++;addStar();speakWord(target.h);launchFW(6);spawnF(5);
    D.mastered[target.h]=true;saveData();
    if(combo>=3){comboBadge.textContent='🔥 连对 '+combo+' 个!';comboBadge.classList.add('show');setTimeout(()=>comboBadge.classList.remove('show'),2000);}
    setTimeout(()=>showSuc(target),450);
  } else {
    btn.classList.add('no');combo=0;comboBadge.classList.remove('show');
    chBar.textContent=rp(chNO);speakWord('再试试');
    setTimeout(()=>btn.classList.remove('no'),450);
  }
}
function showSuc(t){
  const es=["🎉","🥳","🌟","🏆","🎊","💫","🦄","🌈"];
  sucE.textContent=rp(es);sucT.textContent=combo>=3?rp(chCB):rp(chOK);
  sucS.textContent='你认出了「'+t.h+'」';sucOv.classList.add('show');
}
sucNx.onclick=()=>{sucOv.classList.remove('show');gIdx++;loadQ();};

// ===== 星星 & 勋章 =====
function addStar(){
  D.stars++;starEl.textContent=D.stars;starEl.style.transform='scale(1.5)';setTimeout(()=>starEl.style.transform='scale(1)',250);
  if(D.stars%5===0){
    const bl=["🏅","🎖️","👑","💎","🦋","🌈","🎯","🚀","🌺","🎪"];
    const b=bl[Math.min(D.badges.length,bl.length-1)];D.badges.push(b);
    badgeEl.textContent=D.badges.join('');saveData();
    setTimeout(()=>{chBar.textContent='🏅 获得新勋章 '+b+' ！太厉害了！';launchFW(10);speakWord('恭喜获得新勋章');},600);
  }
  saveData();
}

// ===== 成就统计 =====
function renderStats(){
  $('stStar').textContent=D.stars;
  $('stBadge').textContent=D.badges.length;
  const mc=Object.keys(D.mastered).length;
  $('stMaster').textContent=mc;
  $('bwItems').innerHTML=D.badges.length?D.badges.join(''):'<div class="bwe">答对5题获得第一个勋章哦～</div>';
  const mg=$('mGrid');mg.innerHTML='';
  const allH=[...new Set(allWords.map(w=>w.h))];
  allH.forEach(h=>{const d=document.createElement('div');d.className='mc'+(D.mastered[h]?'':' ny');d.textContent=h;mg.appendChild(d);});
}
function resetData(){
  if(!confirm('确定要重置所有进度吗？星星、勋章、认字记录都会清零。'))return;
  D={stars:0,badges:[],mastered:{},groupIdx:{},learnPos:{}};saveData();
  starEl.textContent='0';badgeEl.textContent='';combo=0;renderStats();
  chBar.textContent='🌈 已重置，重新开始吧！';
}

// ===== 特效 =====
function spawnF(n){const its=["💖","🌸","⭐","💗","🐰","🦄","🎀","🌟","✨","🎉","💫"];for(let i=0;i<n;i++){const el=document.createElement('div');el.className='fli';el.textContent=rp(its);el.style.left=(Math.random()*(innerWidth-36)+18)+'px';el.style.top=(innerHeight*.6+Math.random()*80)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1200);}}
function launchFW(n){const cs=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6eb4','#a855f7','#ff9f43'];const cx=innerWidth/2,cy=innerHeight*.4;for(let i=0;i<n;i++){const d=document.createElement('div');d.className='fw';d.style.background=rp(cs);d.style.left=cx+'px';d.style.top=cy+'px';const a=(Math.PI*2/n)*i+Math.random()*.4,ds=50+Math.random()*80;d.style.setProperty('--tx',Math.cos(a)*ds+'px');d.style.setProperty('--ty',Math.sin(a)*ds+'px');document.body.appendChild(d);setTimeout(()=>d.remove(),800);}}

// ===== 触摸滑动 =====
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(curTab!=='learn'||curGrp<0)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>55){lIdx+=d>0?-1:1;updateLearn();}},{passive:true});

// ===== 初始化 =====
starEl.textContent=D.stars;badgeEl.textContent=D.badges.join('');
renderGroups();
setTimeout(()=>{ckTTS();if(!ttsOK&&GROUPS[0]){GROUPS[0].words.forEach(w=>preloadTTS(w.h));}},2000);
</script>
